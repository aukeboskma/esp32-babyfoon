# =====================================================================
#  Babyfoon - zendeenheid voor de babykamer
#  Bord: 303ESP32S3-AI v2.4 ("Xiaozhi AI Voice Chat", ESP32-S3 N16R8)
#  Pinout: github.com/immortalbob/303ESP32S3-AI-ESPHome
#
#  Wat dit doet:
#   - Meet het geluidsniveau (INMP441) en stuurt het naar Home Assistant
#   - "Geluid gedetecteerd" sensor met instelbare drempel (lokaal berekend)
#   - Media player voor witte ruis / slaapliedje (MAX98357A + speaker)
#   - Knoppen: Vol+ / Vol- / WiFi-knop = witte ruis stoppen
#   - Live audiostream op poort 8080 voor de Android-app
#   - Terugpraten vanuit de app via de speaker
#   - Ruisonderdrukking op de stream, instelbaar in Home Assistant
#   - Diagnose: wifi-signaal, uptime, status
#
#  Nodig: ESPHome 2025.5 of nieuwer (voor sound_level)
#
#  VERSIE 2.3.0  (zie ook "Firmwareversie" in Home Assistant)
#   1.0.0  eerste versie: geluidsniveau, stream, knoppen
#   1.1.0  ruisonderdrukking op de stream
#   1.2.0  terugpraten vanuit de app
#   1.3.0  versienummer, IP-adres, volume-schuifjes in Home Assistant
#   1.4.0  app wordt automatisch gebouwd door GitHub (geen wijziging op het bordje)
#   2.1.0  'Ruis inmeten': stelt Ruisgrens en Geluid drempel zelf in
#   2.2.0  bromfilter op de stream (haalt 50 Hz netbrom en lage dreun weg)
#   2.3.0  toegangssleutel op de stream (luisteren, praten, inmeten) + blokkade bij raden
# =====================================================================

substitutions:
  versie: "2.3.0"
  name: babyfoon
  friendly_name: Babyfoon

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  # Versie zichtbaar in HA bij het apparaat ("Firmware")
  project:
    name: "thuis.babyfoon"
    version: "${versie}"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Verplicht volgens de pinout-repo, anders instabiel na lange uptime
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: "y"

# N16R8 = octaal PSRAM. Verplicht. Zet NIET ook CONFIG_SPIRAM_MODE_OCT
# in sdkconfig_options, dan blijft hij hangen bij het opstarten.
psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret babyfoon_api_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Geen stroombesparing: liever stabiel dan zuinig voor een babyfoon
  power_save_mode: none
  ap:
    ssid: "Babyfoon Fallback"
    password: !secret ap_password

captive_portal:

# Eigen component: microfoon als live stream (zie map components/)
external_components:
  - source:
      type: local
      path: components
    components: [audio_stream]

# ---------------------------------------------------------------------
#  Audio: twee aparte I2S-bussen (microfoon en speaker)
# ---------------------------------------------------------------------
i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO4   # INMP441 WS
    i2s_bclk_pin: GPIO5    # INMP441 SCK
  - id: i2s_spk
    i2s_lrclk_pin: GPIO16  # MAX98357A LRC
    i2s_bclk_pin: GPIO15   # MAX98357A BCLK

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO6     # INMP441 SD
    adc_type: external
    pdm: false
    channel: left          # INMP441 met L/R aan GND = links
    sample_rate: 16000
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: spk_hw
    i2s_audio_id: i2s_spk
    i2s_dout_pin: GPIO7    # MAX98357A DIN
    dac_type: external
    channel: mono
    sample_rate: 48000
    bits_per_sample: 16bit

  - platform: mixer
    id: spk_mixer
    output_speaker: spk_hw
    num_channels: 1
    source_speakers:
      - id: media_mix_input
      - id: announce_mix_input
      - id: talk_mix_input       # terugpraten vanuit de app

  - platform: resampler
    id: media_resampler
    output_speaker: media_mix_input

  - platform: resampler
    id: announce_resampler
    output_speaker: announce_mix_input

  - platform: resampler
    id: talk_resampler
    output_speaker: talk_mix_input

media_player:
  - platform: speaker
    id: mp
    name: "Speaker"
    # Maximaal volume begrensd: hij staat dicht bij het bedje
    volume_max: 0.6
    volume_min: 0.1
    volume_initial: 0.3
    media_pipeline:
      speaker: media_resampler
      num_channels: 1
    announcement_pipeline:
      speaker: announce_resampler
      num_channels: 1

# ---------------------------------------------------------------------
#  Geluidsniveau
# ---------------------------------------------------------------------
sensor:
  - platform: sound_level
    microphone: mic
    passive: false          # microfoon draait altijd
    measurement_duration: 1000ms
    rms:
      id: rms_level
      name: "Geluidsniveau"
      # dBFS: 0 = maximaal, stil is rond -70 tot -60
    peak:
      id: peak_level
      name: "Geluidspiek"

  - platform: template
    id: ruis_gemeten
    name: "Gemeten ruisniveau"
    icon: mdi:waveform
    unit_of_measurement: dBFS
    accuracy_decimals: 1
    update_interval: never

  - platform: wifi_signal
    name: "WiFi signaal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome-versie"
    hide_timestamp: true
    entity_category: diagnostic
  - platform: template
    name: "Firmwareversie"
    icon: mdi:tag
    entity_category: diagnostic
    lambda: return {"${versie}"};
    update_interval: 1h
  - platform: wifi_info
    ip_address:
      name: "IP-adres"
      icon: mdi:ip-network
      entity_category: diagnostic

# ---------------------------------------------------------------------
#  Live audiostream voor de app (en om te testen in VLC):
#    http://<IP-VAN-BORDJE>:8080/audio.wav
#  Alleen bereikbaar op je eigen netwerk.
# ---------------------------------------------------------------------
audio_stream:
  id: stream
  microphone:
    microphone: mic
    gain_factor: 1        # niet versterken: de app versterkt zelf, en zo zijn
                          # de dB-waarden in de app gelijk aan die in Home Assistant
  port: 8080
  # Toegangssleutel: zonder deze sleutel kan niemand luisteren, praten of
  # inmeten. Minstens 24 tekens (letters, cijfers, - en _). Zelfde sleutel
  # vul je in de app in. Na 5 foute pogingen wordt dat IP geblokkeerd.
  access_key: !secret babyfoon_stream_key
  max_clients: 2          # bijvoorbeeld twee telefoons
  buffer_duration: 500ms
  # Bromfilter: alles onder deze frequentie wordt weggefilterd (50 Hz netbrom,
  # lage dreun). Huilen en stemmen blijven. Hoger = minder brom, 0 = uit.
  high_pass: 150Hz
  clients:
    name: "Luisteraars"
  # Terugpraten vanuit de app (knop ingedrukt houden)
  talk:
    speaker: talk_resampler
    volume: 50%             # zacht: hij staat dicht bij het bedje
  # Ruisonderdrukking: is het stil (onder de grens), dan stuurt hij stilte
  # in plaats van ruis. Boven de grens direct weer geluid. Startwaarden;
  # daarna instelbaar in Home Assistant (zie "Ruisonderdrukking" en "Ruisgrens").
  # De app kan om "ruis inmeten" vragen
  on_tune:
    - script.execute: ruis_inmeten
  noise_gate:
    enabled: true
    threshold: -40          # iets boven het stille niveau (meet dit eerst)
    hold: 2500ms            # zo lang blijft het open na het laatste geluidje

switch:
  - platform: template
    id: ruis_aan
    name: "Ruisonderdrukking"
    icon: mdi:waveform
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(stream).set_gate_enabled(true);
    turn_off_action:
      - lambda: id(stream).set_gate_enabled(false);

# Drempels en volumes instelbaar vanuit Home Assistant
number:
  # Volume van de speaker (witte ruis, slaapliedjes). Volgt ook de knoppen.
  # 100% hier = het maximum uit volume_max hierboven (niet keihard).
  - platform: template
    id: volume_slider
    name: "Volume"
    icon: mdi:volume-medium
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    update_interval: 1s
    lambda: return id(mp).volume * 100.0f;
    set_action:
      - media_player.volume_set:
          id: mp
          volume: !lambda return x / 100.0f;

  # Volume van je stem bij terugpraten vanuit de app
  - platform: template
    id: talk_volume
    name: "Volume terugpraten"
    icon: mdi:account-voice
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      - lambda: id(stream).set_talk_volume(x / 100.0f);

  - platform: template
    id: ruisgrens
    name: "Ruisgrens"
    icon: mdi:volume-low
    unit_of_measurement: dBFS
    optimistic: true
    restore_value: true
    initial_value: -40
    min_value: -80
    max_value: 0
    step: 1
    mode: slider
    on_value:
      - lambda: id(stream).set_gate_threshold(x);

  - platform: template
    id: drempel
    name: "Geluid drempel"
    icon: mdi:volume-high
    unit_of_measurement: dBFS
    optimistic: true
    restore_value: true
    initial_value: -45
    min_value: -80
    max_value: 0
    step: 1
    mode: slider
    on_value:
      - lambda: id(stream).set_sound_threshold(x);

# ---------------------------------------------------------------------
#  Ruis inmeten: 10 seconden luisteren als het stil is, daarna
#    Ruisgrens       = gemeten ruis + 5 dB
#    Geluid drempel  = gemeten ruis + 10 dB
#  Start via de knop in HA, vanuit de app, of WiFi-knop 3 s ingedrukt.
#  Korte geluidjes tijdens het meten tellen niet mee (stilste 7 van 10 s).
#  Veiligheid: de drempel wordt nooit hoger dan -25 dB gezet.
# ---------------------------------------------------------------------
globals:
  - id: tune_values
    type: std::vector<float>

button:
  - platform: template
    name: "Ruis inmeten"
    icon: mdi:tune-vertical
    on_press:
      - script.execute: ruis_inmeten

script:
  - id: ruis_inmeten
    mode: single
    then:
      - logger.log: "Ruis inmeten: 10 seconden, even stil zijn..."
      - lambda: id(tune_values).clear();
      - repeat:
          count: 10
          then:
            - delay: 1s
            - lambda: |-
                float v = id(rms_level).state;
                if (!std::isnan(v)) id(tune_values).push_back(v);
      - if:
          condition:
            lambda: return id(tune_values).size() >= 5;
          then:
            - lambda: |-
                auto v = id(tune_values);
                std::sort(v.begin(), v.end());
                size_t n = std::min<size_t>(7, v.size());
                float sum = 0;
                for (size_t i = 0; i < n; i++) sum += v[i];
                id(ruis_gemeten).publish_state(sum / n);
            - number.set:
                id: ruisgrens
                value: !lambda return std::min(-30.0f, roundf(id(ruis_gemeten).state + 5.0f));
            - number.set:
                id: drempel
                value: !lambda return std::min(-25.0f, roundf(id(ruis_gemeten).state + 10.0f));
            - logger.log:
                format: "Ruis inmeten klaar: ruis %.1f dB, ruisgrens %.0f, drempel %.0f"
                args: ['id(ruis_gemeten).state', 'id(ruisgrens).state', 'id(drempel).state']
          else:
            - logger.log: "Ruis inmeten mislukt: geen metingen"

binary_sensor:
  # Lokaal berekend: werkt ook als HA traag is.
  # Blijft 10 s "aan" na het laatste geluid, zodat het niet knippert.
  - platform: template
    id: geluid_gedetecteerd
    name: "Geluid gedetecteerd"
    device_class: sound
    lambda: |-
      if (isnan(id(rms_level).state)) return false;
      return id(rms_level).state > id(drempel).state;
    filters:
      - delayed_off: 10s

  - platform: status
    name: "Status"

  # --- Knoppen (actief laag, interne pull-up) ---
  - platform: gpio
    id: btn_vol_up
    name: "Knop volume +"
    pin:
      number: GPIO40
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 30ms
    on_press:
      - media_player.volume_up: mp

  - platform: gpio
    id: btn_vol_down
    name: "Knop volume -"
    pin:
      number: GPIO39
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 30ms
    on_press:
      - media_player.volume_down: mp

  # WiFi-knop: stopt het geluid op de speaker. In HA kun je hem
  # ook gebruiken voor iets anders (zie ha_automations.yaml).
  - platform: gpio
    id: btn_wifi
    name: "Knop WiFi"
    pin:
      number: GPIO1
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 30ms
    on_press:
      - media_player.stop: mp
    # 3 seconden vasthouden = ruis inmeten
    on_click:
      - min_length: 3s
        max_length: 10s
        then:
          - script.execute: ruis_inmeten

  # Optioneel: HC-SR501 PIR-sensor op de PIR-aansluiting.
  # Haal de # weg als je er een aansluit.
  # - platform: gpio
  #   name: "Beweging"
  #   device_class: motion
  #   pin: GPIO8
