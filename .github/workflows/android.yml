name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleRelease

      - name: Read version
        id: version
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' android-app/app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp android-app/app/build/outputs/apk/release/app-release.apk "babyfoon-$V.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: babyfoon-${{ steps.version.outputs.version }}
          path: babyfoon-${{ steps.version.outputs.version }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.version.outputs.version }}
          name: Babyfoon app ${{ steps.version.outputs.version }}
          body: |
            Android app version ${{ steps.version.outputs.version }}.
            Download the APK on your phone and open it to install (allow "install unknown apps" once).
            See CHANGELOG.md for what changed.
          files: babyfoon-${{ steps.version.outputs.version }}.apk
          make_latest: true
