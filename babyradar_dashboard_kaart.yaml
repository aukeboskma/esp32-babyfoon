# Dashboard-kaart voor de babykamer
# Dashboard > bewerken > kaart toevoegen > "Handmatig" > plak dit.
# Pas de entity-ID's aan als ze bij jou anders heten.

type: vertical-stack
cards:
  - type: tile
    entity: sensor.babyradar_status
    name: Babykamer

  - type: glance
    columns: 3
    entities:
      - entity: sensor.babyradar_hartslag_gemiddeld
        name: Hartslag
      - entity: sensor.babyradar_ademhaling_gemiddeld
        name: Ademhaling
      - entity: sensor.babyfoon_geluidsniveau
        name: Geluid

  - type: history-graph
    title: Afgelopen 8 uur
    hours_to_show: 8
    entities:
      - entity: sensor.babyradar_hartslag_gemiddeld
        name: Hartslag (gem.)
      - entity: sensor.babyradar_ademhaling_gemiddeld
        name: Ademhaling (gem.)
      - entity: sensor.babyfoon_geluidsniveau
        name: Geluid

  - type: markdown
    content: >
      *Informatief, geen medische meting. Waarden kunnen wegvallen
      als de baby beweegt of onder het dekbed ligt.*
